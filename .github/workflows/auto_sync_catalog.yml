name: Auto-Sync SoundCloud & YouTube Catalog & EDM News

on:
  schedule:
    # Runs every day at 03:00 UTC (05:00 Italian time)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual run from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync SoundCloud Catalog
        run: python scripts/sync_catalog.py

      - name: Sync YouTube Catalog
        run: python scripts/sync_youtube_catalog.py

      - name: Sync SoundCloud Community Reviews
        run: python scripts/sync_soundcloud_comments.py

      - name: Sync Top Electronic Music News (DJ Mag, We Rave You, Attack Mag, Dancing Astronaut)
        run: python scripts/fetch_edm_news.py

      - name: Verify Catalog Integrity
        run: python scripts/verify_catalog_integrity.py

      - name: Commit and Push if changes detected
        run: |
          git config --global user.name "PRJDEE AutoSync Bot"
          git config --global user.email "bot@prjdee.com"
          git add js/catalog-data.js js/reviews-data.js js/news-data.js data/news.json assets/covers/
          if git diff --staged --quiet; then
            echo "No changes detected in catalog, reviews or news."
          else
            echo "New updates detected! Committing and pushing..."
            git commit -m "Auto-sync catalog, reviews, and fresh EDM news [daily update]"
            git push
          fi
